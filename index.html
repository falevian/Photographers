<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Red de influencia entre fotógrafos · Rafael Vida</title>
<meta name="description" content="Atlas interactivo de la influencia entre fotógrafos: 293 autores y 467 relaciones. Traza linajes, filtra por movimiento y año, encuentra rutas de influencia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{
    --bg:#0a0c10; --bg2:#0d1016; --panel:#13171e; --panel2:#0f131a; --line:#222a35; --line2:#2c3644;
    --text:#dfe3ea; --head:#f3f5f8; --muted:#8a929f; --faint:#5b636f;
    --amber:#f4b13c; --teal:#3fcab0; --violet:#9b8cff; --red:#ef6f53;
    --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    --disp:'Space Grotesk',var(--sans);
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --panelw:340px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:1fr var(--panelw);grid-template-rows:auto 1fr;height:100vh;height:100dvh}
  header{grid-column:1 / -1;display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
  header h1{font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:-.01em;color:var(--head);margin:0}
  header .sub{font-family:var(--mono);font-size:12px;color:var(--faint)}
  header .spacer{flex:1}
  header .byline{font-family:var(--mono);font-size:12px;color:var(--muted)}

  .stage{position:relative;background:radial-gradient(1200px 800px at 60% 35%, #0e1219 0%, var(--bg) 70%);overflow:hidden}
  svg.net{width:100%;height:100%;display:block;cursor:grab}
  svg.net:active{cursor:grabbing}
  .link{fill:none;stroke:#3a4452;stroke-opacity:.35;transition:stroke-opacity .15s,stroke .15s}
  .link.up{stroke:var(--violet);stroke-opacity:.9}
  .link.down{stroke:var(--teal);stroke-opacity:.9}
  .link.path{stroke:var(--amber);stroke-opacity:1;stroke-width:2.4px}
  .node circle{stroke:#0a0c10;stroke-width:1.2px;cursor:pointer;transition:opacity .15s}
  .node.dim{opacity:.12}
  .link.dim{stroke-opacity:.04}
  .node.focus circle{stroke:#fff;stroke-width:2px}
  .label{font-family:var(--mono);font-size:10px;fill:#aeb6c1;pointer-events:none;paint-order:stroke;stroke:#0a0c10;stroke-width:3px;stroke-linejoin:round;opacity:0;transition:opacity .15s}
  .label.show{opacity:1}
  .label.strong{fill:#f3f5f8;font-size:11px}

  /* panel */
  .panel{grid-column:2;grid-row:2;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px}
  .card h3{font-family:var(--disp);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin:0 0 10px}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  input[type=search],input[type=text]{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none}
  input[type=search]:focus{border-color:var(--teal)}
  .btn{font-size:12px;font-family:var(--sans);padding:8px 11px;border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:var(--bg2);color:var(--muted);transition:all .12s}
  .btn:hover{color:var(--text);border-color:var(--muted)}
  .btn.on{border-color:var(--teal);background:rgba(63,202,176,.12);color:var(--teal)}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg .btn{flex:1;text-align:center}
  #results{margin-top:8px;max-height:170px;overflow-y:auto;display:none}
  #results .res{padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text)}
  #results .res:hover,#results .res.active{background:rgba(63,202,176,.12)}
  #results .res small{color:var(--faint);font-family:var(--mono);font-size:11px}
  label.fld{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
  input[type=range]{width:100%;accent-color:var(--teal)}
  .rng{display:flex;align-items:center;gap:8px}
  .rng span{font-family:var(--mono);font-size:12px;color:var(--text);min-width:42px;text-align:right}
  .legend{display:flex;flex-direction:column;gap:5px;max-height:230px;overflow-y:auto}
  .leg{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text);padding:3px 4px;border-radius:6px}
  .leg:hover{background:rgba(255,255,255,.03)}
  .leg.off{opacity:.4}
  .leg .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .leg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .leg .ct{font-family:var(--mono);font-size:11px;color:var(--faint)}

  /* info */
  #info{display:none}
  #info .name{font-family:var(--disp);font-weight:600;font-size:18px;color:var(--head);line-height:1.15}
  #info .meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
  #info .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-top:8px;color:#0a0c10;font-weight:600}
  #info .nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  #info .nums .n{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px}
  #info .nums .n .v{font-family:var(--mono);font-size:17px;color:var(--head)}
  #info .nums .n .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  #info .lst{margin-top:12px}
  #info .lst h4{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
  #info .lst.up h4{color:var(--violet)} #info .lst.down h4{color:var(--teal)}
  #info .chip{display:inline-block;font-size:11.5px;font-family:var(--mono);background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:3px 8px;margin:0 5px 5px 0;cursor:pointer;color:var(--text)}
  #info .chip:hover{border-color:var(--teal);color:var(--teal)}
  #info .ext{display:flex;gap:8px;margin-top:12px}
  #info .ext a{font-size:12px;flex:1;text-align:center;padding:8px;border-radius:8px;border:1px solid var(--line2);color:var(--muted);text-decoration:none}
  #info .ext a:hover{color:var(--text);border-color:var(--muted)}
  .hint{font-size:11px;color:var(--faint);line-height:1.5}

  .stats{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .stats b{color:var(--text);font-weight:500}

  /* tooltip */
  #tip{position:fixed;pointer-events:none;background:rgba(10,12,16,.96);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--text);opacity:0;transition:opacity .1s;z-index:50;max-width:240px}
  #tip .t{font-family:var(--disp);font-weight:600;color:var(--head)}
  #tip .m{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}

  /* floating controls on stage */
  .stage-ctrl{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:20}
  .stage-ctrl .btn{background:rgba(19,23,30,.85);backdrop-filter:blur(4px)}

  .panel-toggle{display:none}

  /* responsive */
  @media(max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .panel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:72vh;grid-column:1;grid-row:auto;
           border-left:none;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;
           transform:translateY(calc(100% - 0px));transition:transform .25s ease;z-index:40;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
    .panel.open{transform:translateY(0)}
    .panel::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:3px;background:var(--line2)}
    .panel-toggle{display:flex;position:fixed;right:12px;bottom:12px;z-index:45;border-radius:24px;padding:11px 16px;
                  background:var(--teal);color:#06231e;border:none;font-weight:600;font-family:var(--sans);font-size:14px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4)}
    header .byline{display:none}
    .stage-ctrl{bottom:auto;top:12px;right:12px;left:auto}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Red de influencia entre fotógrafos</h1>
    <span class="sub" id="hsub">293 autores · 467 relaciones</span>
    <span class="spacer"></span>
    <span class="byline">Rafael Vida</span>
  </header>

  <div class="stage">
    <svg class="net" id="net"></svg>
    <div class="stage-ctrl">
      <button class="btn" id="fit" title="Ajustar a la vista">Ajustar</button>
      <button class="btn" id="reset" title="Limpiar selección">Limpiar</button>
    </div>
  </div>

  <aside class="panel" id="panel">
    <!-- info de selección -->
    <div class="card" id="info"></div>

    <!-- buscador + modo -->
    <div class="card">
      <h3>Buscar y explorar</h3>
      <div class="row"><input id="search" type="search" placeholder="Nombre del fotógrafo..." autocomplete="off"></div>
      <div id="results"></div>
      <label class="fld">Modo</label>
      <div class="seg" id="mode">
        <button class="btn on" data-mode="explore">Explorar</button>
        <button class="btn" data-mode="path">Ruta A→B</button>
      </div>
      <label class="fld">Trazar influencia</label>
      <div class="seg" id="dir">
        <button class="btn" data-dir="up">Ascendentes</button>
        <button class="btn on" data-dir="both">Ambos</button>
        <button class="btn" data-dir="down">Descendientes</button>
      </div>
      <div class="hint" id="pathhint" style="display:none;margin-top:8px"></div>
    </div>

    <!-- análisis -->
    <div class="card">
      <h3>Análisis</h3>
      <label class="fld">Tamaño del nodo según</label>
      <div class="seg" id="size">
        <button class="btn on" data-size="influenced">Influencia</button>
        <button class="btn" data-size="total_degree">Grado total</button>
        <button class="btn" data-size="trophic_level">Nivel trófico</button>
      </div>
      <label class="fld" id="yrlab">Año</label>
      <div class="rng"><input id="ymin" type="range"><span id="yminv"></span></div>
      <div class="rng"><input id="ymax" type="range"><span id="ymaxv"></span></div>
      <label class="fld" id="inflab">Influencia mínima</label>
      <div class="rng"><input id="minf" type="range" min="0" max="20" value="0"><span id="minfv">0</span></div>
      <label class="fld">Etiquetas</label>
      <div class="seg" id="labels">
        <button class="btn" data-lab="none">Ninguna</button>
        <button class="btn on" data-lab="few">Principales</button>
        <button class="btn" data-lab="all">Todas</button>
      </div>
    </div>

    <!-- leyenda / filtro por movimiento -->
    <div class="card">
      <h3 style="display:flex;justify-content:space-between;align-items:center">Movimiento <button class="btn" id="allmov" style="padding:4px 8px">Todos</button></h3>
      <div class="legend" id="legend"></div>
    </div>

    <div class="card">
      <div class="stats" id="stats"></div>
    </div>
  </aside>
</div>

<button class="panel-toggle" id="ptoggle">Controles</button>
<div id="tip"></div>

<script>
"use strict";
(function(){
  var RAW=JSON.parse(document.getElementById("net-data").textContent);
  var nodes=RAW.nodes, links=RAW.links.map(function(l){return {source:l.source,target:l.target};});
  var byId={}; nodes.forEach(function(n){byId[n.id]=n;});

  // adyacencia desde los vecinos ya calculados
  var outAdj={}, inAdj={};
  nodes.forEach(function(n){ outAdj[n.id]=(n.outgoing_neighbors||[]).filter(function(x){return byId[x];}); inAdj[n.id]=(n.incoming_neighbors||[]).filter(function(x){return byId[x];}); });

  // escalas
  var movements=Array.from(new Set(nodes.map(function(n){return n.primary_movement||"—";}))).sort();
  var PALETTE=["#f4b13c","#3fcab0","#9b8cff","#ef6f53","#5aa9ff","#e36ec1","#8fd14f","#ffd166","#4dd2c0","#c792ea","#ff8b6b","#6ec1e4","#f78fb3","#a3e635","#fbbf24","#34d399","#a78bfa","#fb7185","#38bdf8","#f472b6"];
  var color=d3.scaleOrdinal().domain(movements).range(PALETTE);

  var years=nodes.map(function(n){return +n.year||0;}).filter(function(y){return y>0;});
  var yMin=Math.min.apply(null,years), yMax=Math.max.apply(null,years);

  // estado
  var st={mode:"explore",dir:"both",size:"influenced",labels:"few",
          ymin:yMin,ymax:yMax,minf:0,offMov:new Set(),sel:null,pathA:null,pathB:null};

  function metricVal(n){var v=n[st.size]; return (v==null?0:+v);}
  var rScales={};
  ["influenced","total_degree","trophic_level"].forEach(function(k){
    var vals=nodes.map(function(n){return +n[k]||0;});
    rScales[k]=d3.scaleSqrt().domain([0,d3.max(vals)||1]).range([3.5,17]);
  });
  function radius(n){return rScales[st.size](+n[st.size]||0);}

  // top por grado para etiquetas "principales"
  var labelThreshold=(function(){
    var sorted=nodes.map(function(n){return n.total_degree||0;}).sort(function(a,b){return b-a;});
    return sorted[Math.min(28,sorted.length-1)]||0;
  })();

  // ---- svg ----
  var svg=d3.select("#net"), stage=svg.node().parentNode;
  var g=svg.append("g");
  var defs=svg.append("defs");
  [["arrow","#5a6573"],["arrow-up","#9b8cff"],["arrow-down","#3fcab0"],["arrow-path","#f4b13c"]].forEach(function(a){
    defs.append("marker").attr("id",a[0]).attr("viewBox","0 -5 10 10").attr("refX",9).attr("refY",0)
      .attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
      .append("path").attr("d","M0,-4L9,0L0,4").attr("fill",a[1]);
  });
  var gLink=g.append("g"), gNode=g.append("g"), gLabel=g.append("g");

  var W=stage.clientWidth, H=stage.clientHeight;
  var sim=d3.forceSimulation(nodes)
    .force("link",d3.forceLink(links).id(function(d){return d.id;}).distance(60).strength(.5))
    .force("charge",d3.forceManyBody().strength(-130).distanceMax(420))
    .force("center",d3.forceCenter(W/2,H/2))
    .force("collide",d3.forceCollide().radius(function(d){return radius(d)+3;}))
    .velocityDecay(.32).alphaDecay(.028);

  var linkSel=gLink.selectAll("path").data(links).join("path").attr("class","link").attr("marker-end","url(#arrow)");
  var nodeSel=gNode.selectAll("g").data(nodes).join("g").attr("class","node")
    .call(d3.drag().on("start",dstart).on("drag",dmove).on("end",dend));
  nodeSel.append("circle").attr("r",radius).attr("fill",function(d){return color(d.primary_movement||"—");});
  var labelSel=gLabel.selectAll("text").data(nodes).join("text").attr("class","label").attr("dy",-9).attr("text-anchor","middle").text(function(d){return d.name;});

  nodeSel.on("click",function(ev,d){ev.stopPropagation();onNodeClick(d);})
    .on("mouseenter",function(ev,d){showTip(ev,d);if(!st.sel&&st.mode==="explore")hover(d,true);})
    .on("mousemove",moveTip)
    .on("mouseleave",function(ev,d){hideTip();if(!st.sel&&st.mode==="explore")hover(d,false);});
  svg.on("click",function(){clearSel();});

  sim.on("tick",ticked);
  function ticked(){
    linkSel.attr("d",linkPath);
    nodeSel.attr("transform",function(d){return "translate("+d.x+","+d.y+")";});
    labelSel.attr("transform",function(d){return "translate("+d.x+","+d.y+")";});
  }
  function linkPath(d){
    var s=d.source,t=d.target,dx=t.x-s.x,dy=t.y-s.y,dist=Math.hypot(dx,dy)||1;
    var ux=dx/dist,uy=dy/dist, rs=radius(s), rt=radius(t)+5;
    var sx=s.x+ux*rs, sy=s.y+uy*rs, tx=t.x-ux*rt, ty=t.y-uy*rt;
    var mx=(sx+tx)/2, my=(sy+ty)/2, nx=-uy, ny=ux, curve=dist*0.12;
    return "M"+sx+","+sy+"Q"+(mx+nx*curve)+","+(my+ny*curve)+" "+tx+","+ty;
  }

  // zoom
  var zoom=d3.zoom().scaleExtent([0.15,6]).on("zoom",function(ev){g.attr("transform",ev.transform);updateLabelsForZoom(ev.transform.k);});
  svg.call(zoom);
  var curK=1;
  function updateLabelsForZoom(k){curK=k;applyLabels();}

  // drag
  function dstart(ev,d){if(!ev.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y;}
  function dmove(ev,d){d.fx=ev.x;d.fy=ev.y;}
  function dend(ev,d){if(!ev.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}

  // ---- filtros ----
  function visible(n){
    if(st.offMov.has(n.primary_movement||"—"))return false;
    var y=+n.year||0; if(y){if(y<st.ymin||y>st.ymax)return false;}
    if((+n.influenced||0)<st.minf)return false;
    return true;
  }
  function applyFilters(){
    var vis={}; nodes.forEach(function(n){vis[n.id]=visible(n);});
    nodeSel.style("display",function(d){return vis[d.id]?null:"none";});
    labelSel.style("display",function(d){return vis[d.id]?null:"none";});
    linkSel.style("display",function(d){return (vis[d.source.id]&&vis[d.target.id])?null:"none";});
    var vN=nodes.filter(function(n){return vis[n.id];}).length;
    var vL=links.filter(function(l){return vis[l.source.id]&&vis[l.target.id];}).length;
    var top=nodes.filter(function(n){return vis[n.id];}).sort(function(a,b){return (b.influenced||0)-(a.influenced||0);})[0];
    d3.select("#stats").html("<span>Visibles <b>"+vN+"</b> nodos</span><span><b>"+vL+"</b> enlaces</span>"+(top?"<span>Top influencia <b>"+top.name+"</b> ("+top.influenced+")</span>":""));
    applyLabels();
  }

  // ---- etiquetas ----
  function baseLabelVisible(d){
    if(st.labels==="none")return false;
    if(st.labels==="all")return curK>=0.6;
    return (d.total_degree||0)>=labelThreshold || curK>=1.6;
  }
  function applyLabels(){
    var active=currentActiveSet();
    labelSel.classed("show",function(d){ if(active&&active.has(d.id))return true; return baseLabelVisible(d); })
      .classed("strong",function(d){return !!(active&&active.has(d.id));});
  }
  function currentActiveSet(){
    if(st.mode==="path"&&st._path)return new Set(st._path);
    if(st.sel)return st._activeNodes;
    return null;
  }

  // ---- resaltado / trazas ----
  function bfs(startId,adj){
    var seen=new Set([startId]),q=[startId];
    while(q.length){var c=q.shift();(adj[c]||[]).forEach(function(nb){if(!seen.has(nb)){seen.add(nb);q.push(nb);}});}
    return seen;
  }
  function traceNodes(id,dir){
    var s=new Set([id]);
    if(dir==="up"||dir==="both")bfs(id,inAdj).forEach(function(x){s.add(x);});
    if(dir==="down"||dir==="both")bfs(id,outAdj).forEach(function(x){s.add(x);});
    return s;
  }
  function onNodeClick(d){
    if(st.mode==="path"){
      if(!st.pathA){st.pathA=d.id;updatePathHint();highlightPath();}
      else if(!st.pathB&&d.id!==st.pathA){st.pathB=d.id;computePath();}
      else{st.pathA=d.id;st.pathB=null;st._path=null;updatePathHint();highlightPath();}
      return;
    }
    selectNode(d);
  }
  function selectNode(d){
    st.sel=d; st._activeNodes=traceNodes(d.id,st.dir);
    var act=st._activeNodes;
    nodeSel.classed("dim",function(n){return !act.has(n.id);}).classed("focus",function(n){return n.id===d.id;});
    var upSet=(st.dir!=="down")?bfs(d.id,inAdj):new Set();
    var downSet=(st.dir!=="up")?bfs(d.id,outAdj):new Set();
    linkSel.attr("class","link")
      .classed("dim",function(l){return !(act.has(l.source.id)&&act.has(l.target.id));})
      .classed("down",function(l){return downSet.has(l.source.id)&&downSet.has(l.target.id)&&l.source.id!==l.target.id;})
      .classed("up",function(l){return upSet.has(l.source.id)&&upSet.has(l.target.id)&&l.source.id!==l.target.id;})
      .attr("marker-end",function(l){var c=this.classList;return c.contains("down")?"url(#arrow-down)":c.contains("up")?"url(#arrow-up)":"url(#arrow)";});
    showInfo(d); applyLabels();
  }
  function reach(from,x,adj,inclSelf){ if(x===from)return inclSelf; return bfs(from,adj).has(x); }

  function hover(d,on){
    if(on){
      var nb=new Set([d.id]); (outAdj[d.id]||[]).forEach(function(x){nb.add(x);}); (inAdj[d.id]||[]).forEach(function(x){nb.add(x);});
      nodeSel.classed("dim",function(n){return !nb.has(n.id);}).classed("focus",function(n){return n.id===d.id;});
      linkSel.classed("dim",function(l){return !(l.source.id===d.id||l.target.id===d.id);});
      labelSel.classed("show",function(n){return nb.has(n.id)||baseLabelVisible(n);});
    }else{ nodeSel.classed("dim",false).classed("focus",false); linkSel.classed("dim",false); applyLabels(); }
  }
  function clearSel(){
    st.sel=null;st._activeNodes=null;
    if(st.mode==="path"){st.pathA=null;st.pathB=null;st._path=null;updatePathHint();}
    nodeSel.classed("dim",false).classed("focus",false);
    linkSel.attr("class","link").attr("marker-end","url(#arrow)");
    d3.select("#info").style("display","none");
    applyLabels();
  }

  // ---- ruta A->B ----
  function highlightPath(){
    nodeSel.classed("focus",function(n){return n.id===st.pathA||n.id===st.pathB;});
  }
  function shortestPath(a,b){
    var prev={},q=[a],seen=new Set([a]);
    while(q.length){var c=q.shift();if(c===b)break;(outAdj[c]||[]).forEach(function(nb){if(!seen.has(nb)){seen.add(nb);prev[nb]=c;q.push(nb);}});}
    if(!seen.has(b))return null;
    var path=[b],c=b; while(c!==a){c=prev[c];path.unshift(c);} return path;
  }
  function computePath(){
    var p=shortestPath(st.pathA,st.pathB), rev=false;
    if(!p){p=shortestPath(st.pathB,st.pathA); if(p){rev=true;}}
    st._path=p?p.slice():null;
    if(!p){updatePathHint("No hay ruta de influencia dirigida entre ellos.");nodeSel.classed("dim",false);linkSel.attr("class","link").attr("marker-end","url(#arrow)");highlightPath();applyLabels();return;}
    var set=new Set(p), edgeSet=new Set();
    for(var i=0;i<p.length-1;i++)edgeSet.add(p[i]+"→"+p[i+1]);
    nodeSel.classed("dim",function(n){return !set.has(n.id);}).classed("focus",function(n){return set.has(n.id);});
    linkSel.attr("class","link").classed("dim",function(l){return !(edgeSet.has(l.source.id+"→"+l.target.id));})
      .classed("path",function(l){return edgeSet.has(l.source.id+"→"+l.target.id);})
      .attr("marker-end",function(l){return edgeSet.has(l.source.id+"→"+l.target.id)?"url(#arrow-path)":"url(#arrow)";});
    var dirTxt=rev?(st.pathB+" influyó hasta "+st.pathA):(st.pathA+" influyó hasta "+st.pathB);
    updatePathHint("Ruta ("+(p.length-1)+" pasos): "+p.join(" → ")+". "+dirTxt+".");
    applyLabels();
  }
  function updatePathHint(msg){
    var el=d3.select("#pathhint");
    if(st.mode!=="path"){el.style("display","none");return;}
    el.style("display","block");
    if(msg){el.text(msg);return;}
    el.html("Origen: <b style='color:var(--head)'>"+(st.pathA||"elige un nodo")+"</b><br>Destino: <b style='color:var(--head)'>"+(st.pathB||"elige otro")+"</b>");
  }

  // ---- info ----
  function showInfo(d){
    var c=color(d.primary_movement||"—");
    var up=(inAdj[d.id]||[]), down=(outAdj[d.id]||[]);
    function chips(arr){return arr.length?arr.map(function(x){return "<span class='chip' data-go='"+x.replace(/'/g,"&#39;")+"'>"+x+"</span>";}).join(""):"<span class='hint'>ninguno</span>";}
    d3.select("#info").style("display","block").html(
      "<div class='name'>"+d.name+"</div>"+
      "<div class='meta'>"+(d.year||"—")+" · nivel trófico "+(d.trophic_level||"—")+"</div>"+
      "<span class='badge' style='background:"+c+"'>"+(d.primary_movement||"—")+"</span>"+
      "<div class='nums'><div class='n'><div class='v'>"+(d.influenced||0)+"</div><div class='l'>influyó a</div></div>"+
      "<div class='n'><div class='v'>"+(d.influencers||0)+"</div><div class='l'>influido por</div></div>"+
      "<div class='n'><div class='v'>"+(d.total_degree||0)+"</div><div class='l'>grado total</div></div></div>"+
      "<div class='lst up'><h4>Le influyeron</h4>"+chips(up)+"</div>"+
      "<div class='lst down'><h4>Influyó a</h4>"+chips(down)+"</div>"+
      (d.wikipedia_url||d.google_images_url?"<div class='ext'>"+(d.wikipedia_url?"<a href='"+d.wikipedia_url+"' target='_blank' rel='noopener'>Wikipedia</a>":"")+(d.google_images_url?"<a href='"+d.google_images_url+"' target='_blank' rel='noopener'>Imágenes</a>":"")+"</div>":"")
    );
    d3.select("#info").selectAll(".chip").on("click",function(){var id=this.getAttribute("data-go");if(byId[id]){zoomToNode(byId[id]);selectNode(byId[id]);}});
  }

  // ---- tooltip ----
  var tip=document.getElementById("tip");
  function showTip(ev,d){tip.innerHTML="<div class='t'>"+d.name+"</div><div class='m'>"+(d.primary_movement||"—")+" · "+(d.year||"—")+" · influyó a "+(d.influenced||0)+"</div>";tip.style.opacity=1;moveTip(ev);}
  function moveTip(ev){var x=Math.min(ev.clientX+14,innerWidth-252),y=Math.min(ev.clientY+14,innerHeight-70);tip.style.left=x+"px";tip.style.top=y+"px";}
  function hideTip(){tip.style.opacity=0;}

  // ---- zoom helpers ----
  function fit(){
    var pad=60,xs=nodes.filter(visible),
        minX=d3.min(xs,function(d){return d.x;}),maxX=d3.max(xs,function(d){return d.x;}),
        minY=d3.min(xs,function(d){return d.y;}),maxY=d3.max(xs,function(d){return d.y;});
    if(minX==null)return;
    var w=stage.clientWidth,h=stage.clientHeight,bw=maxX-minX||1,bh=maxY-minY||1;
    var k=Math.min(2.5,0.9*Math.min(w/bw,h/bh)),tx=w/2-k*(minX+maxX)/2,ty=h/2-k*(minY+maxY)/2;
    svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(k));
  }
  function zoomToNode(d){var k=1.6,w=stage.clientWidth,h=stage.clientHeight;svg.transition().duration(450).call(zoom.transform,d3.zoomIdentity.translate(w/2-k*d.x,h/2-k*d.y).scale(k));}

  // ---- buscador ----
  function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
  var resBox=document.getElementById("results"),searchEl=document.getElementById("search");
  searchEl.addEventListener("input",function(){
    var q=norm(searchEl.value.trim());
    if(!q){resBox.style.display="none";return;}
    var hits=nodes.filter(function(n){return norm(n.name).indexOf(q)>=0;}).slice(0,12);
    resBox.style.display=hits.length?"block":"none";
    resBox.innerHTML=hits.map(function(n){return "<div class='res' data-id='"+n.id.replace(/'/g,"&#39;")+"'>"+n.name+" <small>"+(n.primary_movement||"")+"</small></div>";}).join("");
    Array.prototype.forEach.call(resBox.querySelectorAll(".res"),function(el){el.onclick=function(){var n=byId[el.getAttribute("data-id")];resBox.style.display="none";searchEl.value=n.name;zoomToNode(n);if(st.mode==="path")onNodeClick(n);else selectNode(n);};});
  });

  // ---- controles ----
  function segBind(id,key,after){
    document.querySelectorAll("#"+id+" .btn").forEach(function(b){
      b.onclick=function(){
        document.querySelectorAll("#"+id+" .btn").forEach(function(x){x.classList.remove("on");});
        b.classList.add("on"); st[key]=b.dataset[Object.keys(b.dataset)[0]]; if(after)after();
      };
    });
  }
  segBind("mode","mode",function(){clearSel();updatePathHint();});
  segBind("dir","dir",function(){if(st.sel)selectNode(st.sel);});
  segBind("size","size",function(){nodeSel.select("circle").transition().duration(300).attr("r",radius);sim.force("collide",d3.forceCollide().radius(function(d){return radius(d)+3;}));sim.alpha(.3).restart();});
  segBind("labels","labels",applyLabels);

  var ymin=document.getElementById("ymin"),ymax=document.getElementById("ymax");
  [ymin,ymax].forEach(function(r){r.min=yMin;r.max=yMax;});
  ymin.value=yMin;ymax.value=yMax;
  document.getElementById("yminv").textContent=yMin;document.getElementById("ymaxv").textContent=yMax;
  ymin.addEventListener("input",function(){st.ymin=Math.min(+ymin.value,+ymax.value);ymin.value=st.ymin;document.getElementById("yminv").textContent=st.ymin;applyFilters();});
  ymax.addEventListener("input",function(){st.ymax=Math.max(+ymax.value,+ymin.value);ymax.value=st.ymax;document.getElementById("ymaxv").textContent=st.ymax;applyFilters();});
  var minf=document.getElementById("minf");
  minf.max=d3.max(nodes,function(n){return +n.influenced||0;});
  minf.addEventListener("input",function(){st.minf=+minf.value;document.getElementById("minfv").textContent=minf.value;applyFilters();});

  // leyenda
  var counts={}; nodes.forEach(function(n){var m=n.primary_movement||"—";counts[m]=(counts[m]||0)+1;});
  var leg=d3.select("#legend");
  movements.slice().sort(function(a,b){return counts[b]-counts[a];}).forEach(function(m){
    var row=leg.append("div").attr("class","leg").attr("data-m",m);
    row.append("span").attr("class","sw").style("background",color(m));
    row.append("span").attr("class","nm").text(m);
    row.append("span").attr("class","ct").text(counts[m]);
    row.on("click",function(){if(st.offMov.has(m)){st.offMov.delete(m);row.classed("off",false);}else{st.offMov.add(m);row.classed("off",true);}applyFilters();});
  });
  document.getElementById("allmov").onclick=function(){st.offMov.clear();leg.selectAll(".leg").classed("off",false);applyFilters();};

  document.getElementById("fit").onclick=fit;
  document.getElementById("reset").onclick=function(){clearSel();searchEl.value="";resBox.style.display="none";};

  // panel móvil
  var panel=document.getElementById("panel"),ptoggle=document.getElementById("ptoggle");
  ptoggle.onclick=function(){panel.classList.toggle("open");ptoggle.textContent=panel.classList.contains("open")?"Cerrar":"Controles";};

  // resize
  function onResize(){W=stage.clientWidth;H=stage.clientHeight;sim.force("center",d3.forceCenter(W/2,H/2));sim.alpha(.2).restart();}
  window.addEventListener("resize",onResize);

  // arranque: pre-estabilizar sin animación de entrada
  sim.stop();
  for(var i=0;i<300;i++)sim.tick();
  ticked();
  applyFilters();
  applyLabels();
  fit();
})();
</script>
</body>
</html>

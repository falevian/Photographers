<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{
    --bg:#f7f6f3; --ink:#1c1b19; --muted:#6f6b64; --line:#e2ded7;
    --panel:#ffffff; --accent:#c0392b; --accent2:#2c6e9b; --edge:#cdc7bd;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
  header .sub{font-size:12px;color:var(--muted);margin-left:-10px}
  .ctrl{display:flex;align-items:center;gap:7px;font-size:13px}
  input[type=search]{padding:6px 9px;border:1px solid var(--line);border-radius:7px;
    font-size:13px;width:230px;background:#fff;color:var(--ink)}
  input[type=range]{width:120px}
  button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;
    font-size:13px;cursor:pointer;color:var(--ink)}
  button:hover{background:#f0ece5}
  label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  #main{flex:1;display:flex;min-height:0}
  #plot{flex:1;position:relative;min-width:0}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg.grabbing{cursor:grabbing}
  aside{width:312px;border-left:1px solid var(--line);background:var(--panel);
    padding:16px;overflow:auto;font-size:13px}
  aside h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    margin:0 0 8px;font-weight:600}
  .hint{color:var(--muted);line-height:1.5}
  .sel-name{font-size:17px;font-weight:600;margin:2px 0}
  .sel-style{font-size:12px;color:var(--muted);margin-bottom:12px}
  .pairbox{background:#f0ece5;border-radius:9px;padding:12px;margin:6px 0 14px}
  .pairbox .big{font-size:22px;font-weight:600}
  .pairbox .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .pairbox .row{margin-top:8px}
  ul.nbrs{list-style:none;margin:6px 0 0;padding:0}
  ul.nbrs li{display:flex;justify-content:space-between;gap:8px;padding:5px 7px;border-radius:6px;
    cursor:pointer;align-items:center}
  ul.nbrs li:hover{background:#f0ece5}
  ul.nbrs .rank{color:var(--muted);width:18px;text-align:right;font-variant-numeric:tabular-nums}
  ul.nbrs .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ul.nbrs .d{font-variant-numeric:tabular-nums;color:var(--accent2)}
  .swatch{width:9px;height:9px;border-radius:50%;flex:none}
  #legend{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.94);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;max-width:230px;
    max-height:42%;overflow:auto;font-size:12px}
  #legend h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .leg-item{display:flex;align-items:center;gap:7px;padding:2px 3px;cursor:pointer;border-radius:5px}
  .leg-item:hover{background:#f0ece5}
  .leg-item.off{opacity:.32}
  #tip{position:absolute;pointer-events:none;background:#1c1b19;color:#fff;padding:5px 8px;
    border-radius:6px;font-size:12px;opacity:0;transition:opacity .08s;white-space:nowrap;z-index:5}
  .node{cursor:pointer}
  .edge{stroke:var(--edge);fill:none}
  .edge.hot{stroke:var(--accent);stroke-opacity:.9}
  .link2{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 4}
  .caption{font-size:11.5px;color:var(--muted);padding:6px 16px;border-top:1px solid var(--line);
    background:var(--panel)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>__TITLE__</h1>
    <div class="ctrl">
      <input id="search" type="search" list="names" placeholder="buscar fotógrafo…" autocomplete="off">
      <datalist id="names"></datalist>
    </div>
    <div class="ctrl"><label for="k">vecinos (k)</label>
      <input id="k" type="range" min="1" max="10" value="3"><span id="kval">3</span></div>
    <div class="ctrl"><label><input id="alledges" type="checkbox" checked> ver todas las aristas</label></div>
    <button id="reset">reiniciar</button>
  </header>
  <div id="main">
    <div id="plot">
      <svg id="svg"></svg>
      <div id="legend"></div>
      <div id="tip"></div>
    </div>
    <aside id="panel"></aside>
  </div>
  <div class="caption">
    Posición por <b>distancia de contenido</b> (las del dendrograma, escalado multidimensional 2D):
    cuanto más cerca en el plano, más parecidos en rasgos. Las aristas unen cada autor con sus k
    vecinos más próximos. Selecciona uno para ver sus vecinos; selecciona dos para la distancia exacta.
  </div>
</div>

<script>
const DATA = __DATA__;
const N = DATA.nodes.length;
const colorOf = {}; DATA.styles.forEach(s => colorOf[s.name] = s.color);

// --- distancias precomputadas para percentiles ---
const allPairs = [];
for (let i=0;i<N;i++) for (let j=i+1;j<N;j++) allPairs.push(DATA.dcont[i][j]);
allPairs.sort((a,b)=>a-b);
function percentilCercania(d){ // % de pares MÁS lejanos que este
  let lo=0, hi=allPairs.length;
  while(lo<hi){const m=(lo+hi)>>1; if(allPairs[m]<d) lo=m+1; else hi=m;}
  return Math.round(100*(allPairs.length-lo)/allPairs.length);
}

const svg = d3.select("#svg");
const gZoom = svg.append("g");
const gEdge = gZoom.append("g");
const gLink = gZoom.append("g");
const gNode = gZoom.append("g");
const tip = d3.select("#tip");
let W=0,H=0, sx, sy;

function resize(){
  const r = document.getElementById("plot").getBoundingClientRect();
  W=r.width; H=r.height;
  const m=34;
  sx = d3.scaleLinear().domain([0,1]).range([m, W-m]);
  sy = d3.scaleLinear().domain([0,1]).range([H-m, m]);
  draw();
}

let K = 3, showAll = true, sel = [], filterStyle = null;

function knnEdges(){
  const E=[];
  for(let i=0;i<N;i++){
    const order = d3.range(N).filter(j=>j!==i).sort((a,b)=>DATA.dcont[i][a]-DATA.dcont[i][b]);
    for(let t=0;t<Math.min(K,order.length);t++){const j=order[t]; if(i<j) E.push([i,j]); else E.push([j,i]);}
  }
  const seen=new Set(), out=[];
  for(const [a,b] of E){const key=a+"-"+b; if(!seen.has(key)){seen.add(key); out.push({a,b,d:DATA.dcont[a][b]});}}
  return out;
}
function nearest(i,k){
  return d3.range(N).filter(j=>j!==i).sort((a,b)=>DATA.dcont[i][a]-DATA.dcont[i][b]).slice(0,k);
}

function draw(){
  const edges = knnEdges();
  const hot = new Set(sel);
  const edgeSel = gEdge.selectAll("line").data(showAll?edges:edges.filter(e=>hot.has(e.a)||hot.has(e.b)), d=>d.a+"-"+d.b);
  edgeSel.join("line")
    .attr("class", d => "edge"+((hot.has(d.a)||hot.has(d.b))?" hot":""))
    .attr("stroke-width", d => 0.6 + 1.6*Math.exp(-d.d))
    .attr("stroke-opacity", d => (hot.has(d.a)||hot.has(d.b))?0.9:0.5)
    .attr("x1",d=>sx(DATA.nodes[d.a].x)).attr("y1",d=>sy(DATA.nodes[d.a].y))
    .attr("x2",d=>sx(DATA.nodes[d.b].x)).attr("y2",d=>sy(DATA.nodes[d.b].y));

  // línea entre los dos seleccionados
  const l2 = gLink.selectAll("line").data(sel.length===2?[sel]:[]);
  l2.join("line").attr("class","link2")
    .attr("x1",d=>sx(DATA.nodes[d[0]].x)).attr("y1",d=>sy(DATA.nodes[d[0]].y))
    .attr("x2",d=>sx(DATA.nodes[d[1]].x)).attr("y2",d=>sy(DATA.nodes[d[1]].y));

  const nodeSel = gNode.selectAll("circle").data(DATA.nodes, d=>d.i);
  nodeSel.join("circle")
    .attr("class","node")
    .attr("cx",d=>sx(d.x)).attr("cy",d=>sy(d.y))
    .attr("r", d => sel.includes(d.i)?8:5)
    .attr("fill", d => colorOf[d.style] || "#999")
    .attr("stroke", d => sel.includes(d.i)?"#1c1b19":"#fff")
    .attr("stroke-width", d => sel.includes(d.i)?2.5:1)
    .attr("opacity", d => {
      if(filterStyle && d.style!==filterStyle) return 0.12;
      if(sel.length && !sel.includes(d.i) && !showAll){
        const near = sel.some(s=>nearest(s,K).includes(d.i));
        return near?0.95:0.25;
      }
      return 0.95;
    })
    .on("mousemove",(ev,d)=>{
      tip.style("opacity",1).html(d.name+" · <span style='opacity:.7'>"+d.style+"</span>")
        .style("left",(ev.offsetX+14)+"px").style("top",(ev.offsetY+12)+"px");
    })
    .on("mouseleave",()=>tip.style("opacity",0))
    .on("click",(ev,d)=>{ ev.stopPropagation(); pick(d.i); });
}

function pick(i){
  if(sel.length===0) sel=[i];
  else if(sel.length===1){ if(sel[0]===i) sel=[]; else sel=[sel[0],i]; }
  else sel=[i];
  renderPanel(); draw();
}

function fmt(x){return x.toFixed(3);}
function renderPanel(){
  const p = d3.select("#panel");
  if(sel.length===0){
    p.html('<h2>cómo usarlo</h2><div class="hint">Haz clic en un fotógrafo para ver a sus '+
      'vecinos más cercanos por contenido. Haz clic en un segundo para medir la distancia entre los dos '+
      'y ver su percentil. Arrastra para mover, rueda para acercar. Usa el buscador para localizar a alguien.</div>');
    return;
  }
  const a = DATA.nodes[sel[0]];
  let html = `<h2>seleccionado</h2>
    <div class="sel-name">${a.name}</div>
    <div class="sel-style"><span class="swatch" style="display:inline-block;background:${colorOf[a.style]||'#999'}"></span> ${a.style}</div>`;
  if(sel.length===2){
    const b = DATA.nodes[sel[1]];
    const d = DATA.dcont[sel[0]][sel[1]];
    const pc = percentilCercania(d);
    const rk = nearest(sel[0],N).indexOf(sel[1])+1;
    let red = "";
    if(DATA.hasRed){
      const dr = DATA.dred[sel[0]][sel[1]];
      red = `<div class="row"><span class="lbl">distancia en la red de influencia</span><br>`+
            (dr<0? `<b>sin camino</b> (no conectados)` : `<b>${dr}</b> paso${dr==1?"":"s"} de influencia`)+`</div>`;
    }
    html += `<div class="sel-name" style="font-size:15px;margin-top:4px">↕ ${b.name}</div>
      <div class="sel-style"><span class="swatch" style="display:inline-block;background:${colorOf[b.style]||'#999'}"></span> ${b.style}</div>
      <div class="pairbox">
        <span class="lbl">distancia de contenido</span><br><span class="big">${fmt(d)}</span>
        <div class="row hint">Más cercanos que el <b>${pc}%</b> de todos los pares.
        ${b.name} es el vecino nº <b>${rk}</b> de ${a.name} por contenido.</div>
        ${red}
      </div>
      <div class="hint">Haz clic en otro fotógrafo para empezar una comparación nueva.</div>`;
  } else {
    const nb = nearest(sel[0], Math.max(K,8));
    html += `<h2>vecinos más cercanos (contenido)</h2><ul class="nbrs">`;
    nb.forEach((j,t)=>{
      const n=DATA.nodes[j];
      html += `<li data-i="${j}"><span class="rank">${t+1}</span>
        <span class="swatch" style="background:${colorOf[n.style]||'#999'}"></span>
        <span class="nm">${n.name}</span><span class="d">${fmt(DATA.dcont[sel[0]][j])}</span></li>`;
    });
    html += `</ul><div class="hint" style="margin-top:8px">Haz clic en uno para medir esa pareja.</div>`;
  }
  p.html(html);
  p.selectAll("ul.nbrs li").on("click",function(){ pick(+this.dataset.i); });
}

function renderLegend(){
  const L=d3.select("#legend");
  L.html("<h3>estilo</h3>");
  DATA.styles.forEach(s=>{
    const it=L.append("div").attr("class","leg-item"+(filterStyle&&filterStyle!==s.name?" off":""));
    it.html(`<span class="swatch" style="background:${s.color}"></span><span>${s.name}</span>`);
    it.on("click",()=>{ filterStyle = (filterStyle===s.name)?null:s.name; renderLegend(); draw(); });
  });
}

// buscador
const dl=d3.select("#names");
DATA.nodes.slice().sort((a,b)=>d3.ascending(a.name,b.name)).forEach(n=>dl.append("option").attr("value",n.name));
d3.select("#search").on("change",function(){
  const n=DATA.nodes.find(d=>d.name===this.value); if(n){ sel=[n.i]; renderPanel(); draw(); }
});
d3.select("#k").on("input",function(){ K=+this.value; d3.select("#kval").text(K); draw(); });
d3.select("#alledges").on("change",function(){ showAll=this.checked; draw(); });
d3.select("#reset").on("click",()=>{ sel=[]; filterStyle=null; d3.select("#search").property("value","");
  svg.transition().call(zoom.transform, d3.zoomIdentity); renderLegend(); renderPanel(); draw(); });
svg.on("click",()=>{ sel=[]; renderPanel(); draw(); });

const zoom=d3.zoom().scaleExtent([0.4,8]).on("zoom",e=>gZoom.attr("transform",e.transform))
  .on("start",()=>svg.classed("grabbing",true)).on("end",()=>svg.classed("grabbing",false));
svg.call(zoom);

window.addEventListener("resize",resize);
renderLegend(); renderPanel(); resize();
</script>
</body>
</html>
